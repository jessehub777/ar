<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机の上のボール転がし - 課題1</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #e8e6e1;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    width: 220px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.92);
    color: #333;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  }

  #title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  #msg {
    font-size: 12px;
    line-height: 1.5;
    color: #555;
    margin-bottom: 10px;
    min-height: 34px;
  }

  #count {
    font-size: 12px;
    color: #666;
    margin-bottom: 10px;
  }

  button {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    color: #fff;
    background: #4a7fd6;
    border: none;
    border-radius: 6px;
    padding: 9px 0;
    margin-bottom: 6px;
    cursor: pointer;
  }

  button:active {
    background: #3a66ad;
  }

  #resetBtn {
    background: #8a8a8a;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="title">机の上のボール転がし</div>
  <div id="msg">りんごをクリックすると回ります。「ボールを落とす」で机の上にボールが落ちてきます。</div>
  <div id="count">ボールの数：<span id="countNum">0</span></div>
  <button type="button" id="dropBtn">ボールを落とす</button>
  <button type="button" id="resetBtn">リセット</button>
</div>

<a-scene>

  <!-- 床 -->
  <a-box id="floor" width="14" height="0.4" depth="14" position="0 -0.2 0"
         material="color: #b99a72" static-body></a-box>

  <!-- 壁（奥と左） -->
  <a-box width="14" height="4" depth="0.2" position="0 2 -7"
         material="color: #e4e0d8" static-body></a-box>
  <a-box width="14" height="4" depth="0.2" position="-7 2 0" rotation="0 90 0"
         material="color: #d9d5cc" static-body></a-box>

  <!-- 机（天板と4本の脚） -->
  <a-box width="2.6" height="0.12" depth="1.5" position="0 0.74 0"
         material="color: #a9773f" static-body></a-box>

  <a-box width="0.12" height="0.74" depth="0.12" position="-1.2 0.37 -0.66"
         material="color: #8a5f31" static-body></a-box>
  <a-box width="0.12" height="0.74" depth="0.12" position="1.2 0.37 -0.66"
         material="color: #8a5f31" static-body></a-box>
  <a-box width="0.12" height="0.74" depth="0.12" position="-1.2 0.37 0.66"
         material="color: #8a5f31" static-body></a-box>
  <a-box width="0.12" height="0.74" depth="0.12" position="1.2 0.37 0.66"
         material="color: #8a5f31" static-body></a-box>

  <!-- 机の上の物 -->
  <a-sphere id="apple" position="-0.7 0.95 0.1" radius="0.18"
            material="color: #d64545"></a-sphere>

  <a-box position="-0.05 0.89 0.05" width="0.34" height="0.32" depth="0.34"
         material="color: #4a7fd6"></a-box>

  <a-cylinder position="0.72 0.98 0.15" radius="0.14" height="0.4"
              material="color: #5ba86a"></a-cylinder>

  <!-- 落下したボールを入れておく場所 -->
  <a-entity id="balls"></a-entity>

  <!-- ライト -->
  <a-entity light="type: ambient; intensity: 0.75"></a-entity>
  <a-entity light="type: directional; position: 3 6 4; intensity: 0.65"></a-entity>

  <a-entity camera position="0 1.35 3.4" rotation="-13 0 0"></a-entity>

</a-scene>

<script>
/* ===========================================================================
   【外部コード】
   床のテクスチャを Canvas で描画している部分。
   授業では画像ファイルを読み込む方法しか扱っていないため、
   Canvas に木目の線を描く処理は AI のサポートで実装した。
   =========================================================================== */
function makeWoodTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512;
  cv.height = 512;
  const g = cv.getContext('2d');

  g.fillStyle = '#d8c3a0';
  g.fillRect(0, 0, 512, 512);

  // 板を横に並べる
  const plankH = 64;
  for (let y = 0; y < 512; y += plankH) {
    // 板ごとに少し色を変える
    const shade = 0.93 + Math.random() * 0.12;
    g.fillStyle = `rgba(${Math.floor(200 * shade)}, ${Math.floor(175 * shade)}, ${Math.floor(140 * shade)}, 0.55)`;
    g.fillRect(0, y, 512, plankH - 2);

    // 板の継ぎ目
    g.fillStyle = 'rgba(140, 110, 75, 0.45)';
    g.fillRect(0, y + plankH - 2, 512, 2);

    // 木目
    g.strokeStyle = 'rgba(160, 130, 95, 0.20)';
    g.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const gy = y + 12 + Math.random() * (plankH - 24);
      g.beginPath();
      g.moveTo(0, gy);
      for (let x = 0; x <= 512; x += 64) {
        g.lineTo(x, gy + (Math.random() - 0.5) * 4);
      }
      g.stroke();
    }
  }

  return cv.toDataURL('image/png');
}
/* ===========================================================================
   【外部コードここまで】
   =========================================================================== */


/* ===========================================================================
   【自分のコード】
   シーンの操作、クリック判定、ボールの生成。
   授業で扱った a-box / a-sphere / a-cylinder、animation コンポーネント、
   dynamic-body をベースにしている。
   =========================================================================== */

const scene = document.querySelector('a-scene');
const ballLayer = document.getElementById('balls');
const countNum = document.getElementById('countNum');
const msgEl = document.getElementById('msg');
const dropBtn = document.getElementById('dropBtn');
const resetBtn = document.getElementById('resetBtn');
const apple = document.getElementById('apple');

let ballCount = 0;

/* ボールを1個落とす */
function dropBall() {
  const ball = document.createElement('a-sphere');
  ball.setAttribute('radius', '0.16');
  ball.setAttribute('material', 'color: #e8b33c');
  // 机の真上から落とす。続けて落としたときに玉どうしが重ならないよう、
  // ボールの番号で横位置をずらす
  const offsetX = ((ballCount % 5) - 2) * 0.36;
  ball.setAttribute('position', `${offsetX} 1.75 0`);
  ball.setAttribute('dynamic-body', 'shape: sphere; sphereRadius: 0.16; mass: 1');
  ballLayer.appendChild(ball);

  ballCount++;
  countNum.textContent = String(ballCount);
  msgEl.textContent = 'ボールが落ちてきました。机の上で跳ねて転がります。';
}

/* りんごを回す */
function spinApple() {
  apple.setAttribute('animation', {
    property: 'rotation',
    to: '0 360 0',
    dur: 1000,
    easing: 'easeInOutQuad'
  });
  msgEl.textContent = 'りんごが1回転しました。';

  // アニメーションが終わったら角度を戻しておく（次のクリックでまた回せるように）
  setTimeout(() => {
    apple.removeAttribute('animation');
    apple.setAttribute('rotation', '0 0 0');
  }, 1050);
}

/* リセット */
function resetScene() {
  ballLayer.innerHTML = '';
  ballCount = 0;
  countNum.textContent = '0';
  apple.removeAttribute('animation');
  apple.setAttribute('rotation', '0 0 0');
  msgEl.textContent = 'りんごをクリックすると回ります。「ボールを落とす」で机の上にボールが落ちてきます。';
}

/* クリック判定（りんごだけ反応する） */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function onPointerDown(ev) {
  if (ev.target && ev.target.tagName === 'BUTTON') return;

  pointer.x = (ev.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / window.innerHeight) * 2 + 1;

  if (!scene.camera) return;

  raycaster.setFromCamera(pointer, scene.camera);
  const hits = raycaster.intersectObject(apple.object3D, true);
  if (hits.length > 0) {
    spinApple();
  }
}

/* 起動 */
scene.addEventListener('loaded', () => {
  // 【外部コード】生成した木目テクスチャを床に貼る
  const floorEl = document.getElementById('floor');
  floorEl.setAttribute('material', 'src', makeWoodTexture());
  // color はテクスチャに掛け算されるので白にしておく
  floorEl.setAttribute('material', 'color', '#ffffff');

  resetScene();

  if (scene.renderer && scene.renderer.domElement) {
    scene.renderer.domElement.addEventListener('pointerdown', onPointerDown);
  }
});

dropBtn.addEventListener('click', dropBall);
resetBtn.addEventListener('click', resetScene);

/* ===========================================================================
   【自分のコードここまで】
   =========================================================================== */
</script>
</body>
</html>

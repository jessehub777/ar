<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机の上のボール転がし - 課題1</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #e8e6e1;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    width: 220px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.92);
    color: #333;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  }

  #title { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
  #msg { font-size: 12px; line-height: 1.5; color: #555; margin-bottom: 10px; min-height: 34px; }
  #count { font-size: 12px; color: #666; margin-bottom: 10px; }

  button {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    color: #fff;
    background: #4a7fd6;
    border: none;
    border-radius: 6px;
    padding: 9px 0;
    margin-bottom: 6px;
    cursor: pointer;
  }

  button:active { background: #3a66ad; }
  #resetBtn { background: #8a8a8a; }
</style>
</head>
<body>

<div id="hud">
  <div id="title">机の上のボール転がし</div>
  <div id="msg">りんごをクリックすると回ります。「ボールを落とす」で机の上にボールが落ちてきます。</div>
  <div id="count">ボールの数：<span id="countNum">0</span></div>
  <button type="button" id="dropBtn">ボールを落とす</button>
  <button type="button" id="resetBtn">リセット</button>
</div>

<a-scene>

  <!-- 床（テクスチャは起動時に貼る） -->
  <a-box id="floor" width="14" height="0.4" depth="14" position="0 -0.2 0"
         material="color: #ffffff; repeat: 14 14" static-body></a-box>

  <!-- 壁（奥と左） -->
  <a-box width="14" height="4" depth="0.2" position="0 2 -7"
         material="color: #e4e0d8" static-body></a-box>
  <a-box width="14" height="4" depth="0.2" position="-7 2 0" rotation="0 90 0"
         material="color: #d9d5cc" static-body></a-box>

  <!-- 机（天板と4本の脚） -->
  <a-box width="2.6" height="0.12" depth="1.5" position="0 0.74 0"
         material="color: #a9773f" static-body></a-box>

  <a-box width="0.12" height="0.74" depth="0.12" position="-1.2 0.37 -0.66"
         material="color: #8a5f31" static-body></a-box>
  <a-box width="0.12" height="0.74" depth="0.12" position="1.2 0.37 -0.66"
         material="color: #8a5f31" static-body></a-box>
  <a-box width="0.12" height="0.74" depth="0.12" position="-1.2 0.37 0.66"
         material="color: #8a5f31" static-body></a-box>
  <a-box width="0.12" height="0.74" depth="0.12" position="1.2 0.37 0.66"
         material="color: #8a5f31" static-body></a-box>

  <!-- 机の上の物 -->
  <a-sphere id="apple" class="clickable" position="-0.7 0.95 0.1" radius="0.18"
            material="color: #d64545"></a-sphere>

  <a-box position="-0.05 0.89 0.05" width="0.34" height="0.32" depth="0.34"
         material="color: #4a7fd6"></a-box>

  <a-cylinder position="0.72 0.98 0.15" radius="0.14" height="0.4"
              material="color: #5ba86a"></a-cylinder>

  <!-- 落下したボールを入れておく場所 -->
  <a-entity id="balls"></a-entity>

  <!-- ライト -->
  <a-entity light="type: ambient; intensity: 0.75"></a-entity>
  <a-entity light="type: directional; position: 3 6 4; intensity: 0.65"></a-entity>

  <!-- カメラ。cursor を付けるとマウスのクリックを3Dオブジェクトで受け取れる -->
  <a-entity camera position="0 1.2 2.9" rotation="-14 0 0">
    <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
  </a-entity>

</a-scene>

<script>
/* ---------------------------------------------------------------------------
   【外部コード】
   床の木目テクスチャを Canvas で描いている部分。
   授業では画像ファイルを読み込む方法しか扱っていないため、
   Canvas にしま模様を描く処理は AI のサポートで実装した。
   --------------------------------------------------------------------------- */
function makeWoodTexture() {
  const cv = document.createElement('canvas');
  cv.width = 64;
  cv.height = 64;
  const g = cv.getContext('2d');

  g.fillStyle = '#d9c2a0';      // 明るい板
  g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#c6ab84';      // 暗い板
  g.fillRect(0, 0, 64, 20);
  g.fillRect(0, 40, 64, 20);

  return cv.toDataURL();
}
/* 【外部コードここまで】 */


/* ---------------------------------------------------------------------------
   【自分のコード】
   --------------------------------------------------------------------------- */
const ballLayer = document.getElementById('balls');
const countNum = document.getElementById('countNum');
const msgEl = document.getElementById('msg');
const dropBtn = document.getElementById('dropBtn');
const resetBtn = document.getElementById('resetBtn');
const apple = document.getElementById('apple');

let ballCount = 0;

// ボールを1個落とす
function dropBall() {
  const ball = document.createElement('a-sphere');
  ball.setAttribute('radius', '0.11');
  ball.setAttribute('material', 'color: #e8b33c');
  // 続けて落としたときに重ならないよう、番号で横位置をずらす。
  // 机の上の物と重ならないよう、手前側（z=0.42）に落とす
  ball.setAttribute('position', `${((ballCount % 5) - 2) * 0.42} 1.75 0.42`);
  ball.setAttribute('dynamic-body', 'shape: sphere; sphereRadius: 0.11; mass: 1');
  ballLayer.appendChild(ball);

  ballCount++;
  countNum.textContent = ballCount;
  msgEl.textContent = 'ボールが落ちてきました。机の上で跳ねて転がります。';
}

// りんごを1回転させる
function spinApple() {
  apple.setAttribute('animation',
    'property: rotation; to: 0 360 0; dur: 1000; easing: easeInOutQuad');
  msgEl.textContent = 'りんごが1回転しました。';

  // 終わったら角度を戻す（もう一度クリックできるように）
  setTimeout(() => {
    apple.removeAttribute('animation');
    apple.setAttribute('rotation', '0 0 0');
  }, 1050);
}

// リセット
function resetScene() {
  ballLayer.innerHTML = '';
  ballCount = 0;
  countNum.textContent = '0';
  apple.removeAttribute('animation');
  apple.setAttribute('rotation', '0 0 0');
  msgEl.textContent = 'りんごをクリックすると回ります。「ボールを落とす」で机の上にボールが落ちてきます。';
}

// 起動したらテクスチャを貼って初期化
document.querySelector('a-scene').addEventListener('loaded', () => {
  document.getElementById('floor').setAttribute('material', 'src', makeWoodTexture());
  resetScene();

  // cursor がクリックを拾ったときに呼ばれる
  apple.addEventListener('click', spinApple);
});

dropBtn.addEventListener('click', dropBall);
resetBtn.addEventListener('click', resetScene);
</script>
</body>
</html>

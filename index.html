<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 999;
      }

      button {
        font-size: 20px;
        padding: 12px 20px;
        border: none;
        background-color: royalblue;
        color: white;
        border-radius: 10px;
        margin-right: 10px;
      }

      select {
        font-size: 18px;
        padding: 10px 12px;
        border-radius: 8px;
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <select id="animationSelect">
        <option value="CharacterArmature|Idle" selected>待つ</option>
        <option value="CharacterArmature|Walk">あるく</option>
        <option value="CharacterArmature|Run">はしる</option>
        <option value="CharacterArmature|Run_Back">後ろに走る</option>
        <option value="CharacterArmature|Run_Left">左に走る</option>
        <option value="CharacterArmature|Run_Right">右に走る</option>
        <option value="CharacterArmature|Wave">手を振る</option>
        <option value="CharacterArmature|Idle_Neutral">腕を下ろす</option>
        <option value="CharacterArmature|Idle_Gun">銃を持ったまま待つ</option>
        <option value="CharacterArmature|Idle_Gun_Pointing">銃を向ける</option>
        <option value="CharacterArmature|Idle_Gun_Shoot">銃を撃つ構え</option>
        <option value="CharacterArmature|Idle_Sword">剣を持ったまま待つ</option>
        <option value="CharacterArmature|Punch_Left">左パンチ</option>
        <option value="CharacterArmature|Punch_Right">右パンチ</option>
        <option value="CharacterArmature|Kick_Left">左キック</option>
        <option value="CharacterArmature|Kick_Right">右キック</option>
        <option value="CharacterArmature|Sword_Slash">剣を振る</option>
        <option value="CharacterArmature|Gun_Shoot">銃を撃つ</option>
        <option value="CharacterArmature|Run_Shoot">撃ちながら走る</option>
        <option value="CharacterArmature|Roll">転がる</option>
        <option value="CharacterArmature|Interact">話す</option>
        <option value="CharacterArmature|HitRecieve">ダメージを受ける</option>
        <option value="CharacterArmature|HitRecieve_2">ダメージを受ける2</option>
        <option value="CharacterArmature|Death">しぬ</option>
      </select>
      <button id="enlargeButton">拡大</button>
      <button id="shrinkButton">縮小</button>
      <button id="rotateButton">回転</button>
      <button id="reverseButton">逆回転</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam">
      <a-marker preset="hiro" smooth="true">
        <a-entity id="model" position="0 0 0.5">
          <a-gltf-model
            id="robot"
            src="robot.glb"
            position="0 0 0"
            scale="0.7 0.7 0.7"
            rotation="-90 0 0"
            animation-mixer="clip: CharacterArmature|Idle">
          </a-gltf-model>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const robot = document.getElementById('robot')
      const animationSelect = document.getElementById('animationSelect')
      const model = document.getElementById('model')
      const enlargeButton = document.getElementById('enlargeButton')
      const shrinkButton = document.getElementById('shrinkButton')
      const rotateButton = document.getElementById('rotateButton')
      const reverseButton = document.getElementById('reverseButton')

      let size = 1
      let angle = 0

      function changeAnimation() {
        robot.setAttribute('animation-mixer', 'clip', animationSelect.value)
      }

      function enlargeModel() {
        size = size + 0.1
        model.setAttribute('scale', `${size} ${size} ${size}`)
      }

      function shrinkModel() {
        size = Math.max(size - 0.1, 0.1)
        model.setAttribute('scale', `${size} ${size} ${size}`)
      }

      function rotateModel() {
        angle = angle + 15
        model.setAttribute('rotation', `0 0 ${angle}`)
      }

      function reverseModel() {
        angle = angle - 15
        model.setAttribute('rotation', `0 0 ${angle}`)
      }

      animationSelect.addEventListener('change', changeAnimation)
      enlargeButton.addEventListener('click', enlargeModel)
      shrinkButton.addEventListener('click', shrinkModel)
      rotateButton.addEventListener('click', rotateModel)
      reverseButton.addEventListener('click', reverseModel)
    </script>
  </body>
</html>

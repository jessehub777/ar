<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR 宝箱あてゲーム</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    /* AR.js のカメラ映像は z-index:-2 で背面に置かれるため、
       body に背景色を指定すると映像が隠れる。透明のままにする。 */
    background: transparent;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #hud {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 999;
    width: 232px;
    padding: 12px 14px 14px;
    border-radius: 12px;
    background: rgba(12, 16, 24, 0.78);
    color: #eef2f7;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  }

  #title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
    color: #ffd76a;
  }

  .stat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    color: #9fb0c4;
    margin-bottom: 4px;
  }

  .stat b {
    font-size: 15px;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  #hpbar {
    height: 7px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.16);
    overflow: hidden;
    margin: 6px 0 10px;
  }

  #hpfill {
    display: block;
    height: 100%;
    width: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #35c46a, #7ae0a4);
    transition: width 0.28s ease, background 0.28s ease;
  }

  #msg {
    min-height: 34px;
    font-size: 12.5px;
    line-height: 1.45;
    color: #d7e2ee;
    margin-bottom: 10px;
  }

  #buttons {
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: #3a6df0;
    border: none;
    border-radius: 9px;
    padding: 11px 0;
    cursor: pointer;
    transition: background 0.15s, transform 0.08s;
  }

  button:active { transform: scale(0.96); }

  button:disabled {
    background: #3a4150;
    color: #7d8798;
    cursor: default;
    transform: none;
  }

  #reset {
    width: 100%;
    margin-top: 8px;
    font-size: 13px;
    padding: 8px 0;
    background: #4a5468;
  }

  #hint {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    z-index: 999;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.72);
    background: rgba(0, 0, 0, 0.45);
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }

  #flash {
    position: fixed;
    inset: 0;
    z-index: 998;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s ease;
  }

  /* スマートフォンではHUDを縮小する */
  @media (max-width: 520px) {
    #hud {
      width: 176px;
      padding: 9px 10px 10px;
      top: 10px;
      left: 10px;
    }

    #title { font-size: 12px; margin-bottom: 7px; }
    .stat { font-size: 10.5px; }
    .stat b { font-size: 13px; }
    #msg { font-size: 11px; min-height: 30px; margin-bottom: 8px; }
    button { font-size: 15px; padding: 9px 0; border-radius: 8px; }
    #reset { font-size: 11.5px; padding: 7px 0; }
    #hint { font-size: 10.5px; padding: 5px 10px; }
  }
</style>
</head>
<body>

<div id="hud">
  <div id="title">AR 宝箱あてゲーム</div>

  <div class="stat"><span>ラウンド</span><b id="roundText">1 / 3</b></div>
  <div class="stat"><span>スコア</span><b id="scoreText">0</b></div>
  <div class="stat"><span>HP</span><b id="hpText">3</b></div>
  <div id="hpbar"><i id="hpfill"></i></div>

  <div id="msg">3つの宝箱から、当たりを選んでください。</div>

  <div id="buttons">
    <button type="button" data-choice="1">1</button>
    <button type="button" data-choice="2">2</button>
    <button type="button" data-choice="3">3</button>
  </div>
  <button type="button" id="reset">リセット</button>
</div>

<div id="flash"></div>
<div id="hint">Hiroマーカーをカメラに映してください</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false">

  <a-marker preset="hiro" smooth="true">
    <a-entity id="stage" position="0 0 0.10" rotation="-90 0 0" scale="1.05 1.05 1.05"></a-entity>
  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
/* ============================================================
   ゲームの状態
   ============================================================ */
const TOTAL_ROUNDS = 3;
const MAX_HP = 3;
const CHEST_X = [-0.345, 0, 0.345];   // 3つの宝箱の横位置

let answer = 0;        // 当たりの番号（1〜3）
let round = 1;         // 現在のラウンド
let score = 0;         // 正解数
let hp = MAX_HP;       // 残りHP
let locked = false;    // 開封アニメーション中は入力を受け付けない

const stage = document.getElementById('stage');
const msgEl = document.getElementById('msg');
const roundText = document.getElementById('roundText');
const scoreText = document.getElementById('scoreText');
const hpText = document.getElementById('hpText');
const hpfill = document.getElementById('hpfill');
const flashEl = document.getElementById('flash');
const buttons = [...document.querySelectorAll('#buttons button')];
const resetBtn = document.getElementById('reset');

/* ============================================================
   宝箱を組み立てる
   見た目は3つとも完全に同じにして、外から当たりを判別できないようにする
   ============================================================ */
const WOOD = '#8b5a2b';
const WOOD_DARK = '#6b431f';
const GOLD = '#c9a227';

function buildChest(index) {
  const root = document.createElement('a-entity');
  root.setAttribute('position', `${CHEST_X[index]} 0 0`);
  root.setAttribute('class', 'chest');
  root.setAttribute('data-index', index + 1);
  root.setAttribute('data-open', 'false');

  // 本体
  root.innerHTML = `
    <a-box class="hitbox" width="0.3" height="0.26" depth="0.22"
           position="0 0.13 0" material="opacity: 0; transparent: true"></a-box>

    <a-box width="0.26" height="0.15" depth="0.18" position="0 0.075 0"
           material="color: ${WOOD}; roughness: 0.9"></a-box>

    <!-- フタを開けたときに見える内側（暗い空洞） -->
    <a-box width="0.23" height="0.015" depth="0.15" position="0 0.152 0"
           material="color: #2a1a0d; roughness: 1"></a-box>

    <!-- 本体とフタの境目 -->
    <a-box width="0.265" height="0.014" depth="0.185" position="0 0.147 0"
           material="color: #4a2f15; roughness: 1"></a-box>

    <a-box width="0.27" height="0.02" depth="0.19" position="0 0.02 0"
           material="color: ${WOOD_DARK}; roughness: 0.9"></a-box>

    <a-box width="0.02" height="0.15" depth="0.185" position="-0.085 0.075 0"
           material="color: ${WOOD_DARK}; roughness: 0.9"></a-box>
    <a-box width="0.02" height="0.15" depth="0.185" position="0.085 0.075 0"
           material="color: ${WOOD_DARK}; roughness: 0.9"></a-box>

    <a-entity class="lid" position="0 0.15 -0.09">
      <a-box width="0.27" height="0.075" depth="0.19" position="0 0.038 0.09"
             material="color: ${WOOD}; roughness: 0.9"></a-box>
      <a-box width="0.22" height="0.035" depth="0.15" position="0 0.093 0.09"
             material="color: ${WOOD}; roughness: 0.9"></a-box>
      <a-box width="0.02" height="0.08" depth="0.192" position="-0.085 0.04 0.09"
             material="color: ${WOOD_DARK}; roughness: 0.9"></a-box>
      <a-box width="0.02" height="0.08" depth="0.192" position="0.085 0.04 0.09"
             material="color: ${WOOD_DARK}; roughness: 0.9"></a-box>
      <a-box width="0.04" height="0.055" depth="0.022" position="0 0.005 0.182"
             material="color: ${GOLD}; metalness: 0.7; roughness: 0.3"></a-box>
      <a-box width="0.012" height="0.02" depth="0.01" position="0 -0.004 0.194"
             material="color: #3a2a10; roughness: 1"></a-box>
    </a-entity>

    <a-text value="${index + 1}" position="0 0.45 0" align="center"
            width="0.16" wrap-count="1" color="#ffd76a"
            text="outline: 8px; outlineColor: #10151f"></a-text>
  `;
  return root;
}

for (let i = 0; i < 3; i++) {
  stage.appendChild(buildChest(i));
}

const chests = [...stage.querySelectorAll('.chest')];

/* ============================================================
   効果音（外部ファイルを使わず WebAudio で生成する）
   ============================================================ */
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, startSec, durSec, type = 'sine', peak = 0.16) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + startSec;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durSec);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + durSec + 0.02);
}

function playCorrect() {
  tone(660, 0.00, 0.16, 'triangle');
  tone(880, 0.10, 0.16, 'triangle');
  tone(1320, 0.20, 0.30, 'triangle');
}

function playWrong() {
  tone(220, 0.00, 0.20, 'sawtooth', 0.10);
  tone(165, 0.14, 0.30, 'sawtooth', 0.10);
}

function playOver() {
  tone(392, 0.00, 0.22, 'square', 0.10);
  tone(311, 0.20, 0.22, 'square', 0.10);
  tone(262, 0.40, 0.45, 'square', 0.10);
}

/* ============================================================
   簡易トゥイーン（A-Frame の animation を使わず自前で補間する）
   ============================================================ */
function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function tween(duration, onUpdate, onComplete) {
  const start = performance.now();
  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    onUpdate(easeOutCubic(t));
    if (t < 1) {
      requestAnimationFrame(frame);
    } else if (onComplete) {
      onComplete();
    }
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   演出：宝箱を開ける / 金貨を飛ばす
   ============================================================ */
function openLid(chestEl) {
  const lid = chestEl.querySelector('.lid');
  tween(620, (t) => {
    lid.object3D.rotation.x = -2.0 * t;   // 約 -115 度まで開く
  });
}

function closeLidInstantly(chestEl) {
  const lid = chestEl.querySelector('.lid');
  lid.object3D.rotation.x = 0;
}

function spawnCoins(chestEl) {
  const pos = chestEl.getAttribute('position');
  for (let i = 0; i < 10; i++) {
    const coin = document.createElement('a-cylinder');
    coin.setAttribute('radius', 0.022);
    coin.setAttribute('height', 0.006);
    coin.setAttribute('material', `color: ${i % 2 ? '#ffd24a' : '#ffec9e'}; metalness: 0.7; roughness: 0.3`);
    coin.setAttribute('position', `${pos.x} ${pos.y + 0.17} 0.02`);
    coin.setAttribute('rotation', `${90 + Math.random() * 40} ${Math.random() * 360} 0`);
    stage.appendChild(coin);

    const vx = (Math.random() - 0.5) * 0.85;
    let vy = 0.85 + Math.random() * 0.55;
    const vz = 0.12 + Math.random() * 0.35;
    let px = pos.x, py = pos.y + 0.17, pz = 0.02;
    let t = 0;
    const dt = 1 / 60;

    (function step() {
      t += dt;
      vy -= 2.6 * dt;
      px += vx * dt;
      py += vy * dt;
      pz += vz * dt;
      if (py < -0.05) {
        stage.removeChild(coin);
        return;
      }
      coin.setAttribute('position', `${px} ${py} ${pz}`);
      coin.object3D.rotation.y += 0.3;
      coin.object3D.rotation.x += 0.12;
      requestAnimationFrame(step);
    })();
  }
}

function flash(color) {
  flashEl.style.background = color;
  flashEl.style.opacity = '0.26';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 130);
}

/* ============================================================
   HUD の更新
   ============================================================ */
function updateHUD() {
  roundText.textContent = `${Math.min(round, TOTAL_ROUNDS)} / ${TOTAL_ROUNDS}`;
  scoreText.textContent = String(score);
  hpText.textContent = String(hp);
  const ratio = Math.max(hp, 0) / MAX_HP;
  hpfill.style.width = `${ratio * 100}%`;
  hpfill.style.background = ratio > 0.66
    ? 'linear-gradient(90deg, #35c46a, #7ae0a4)'
    : ratio > 0.33
      ? 'linear-gradient(90deg, #e0a92e, #ffd76a)'
      : 'linear-gradient(90deg, #d84343, #ff8080)';
}

function setButtonsEnabled(on) {
  buttons.forEach((b) => { b.disabled = !on; });
}

/* ============================================================
   ゲーム進行
   ============================================================ */
function startRound() {
  answer = 1 + Math.floor(Math.random() * 3);

  chests.forEach((c) => {
    closeLidInstantly(c);
    c.setAttribute('data-open', 'false');
  });

  locked = false;
  setButtonsEnabled(true);
  updateHUD();
  msgEl.textContent = '3つの宝箱から、当たりを選んでください。';
}

function choose(num) {
  if (locked) return;
  if (round > TOTAL_ROUNDS) return;

  locked = true;
  setButtonsEnabled(false);

  const picked = chests[num - 1];
  picked.setAttribute('data-open', 'true');
  openLid(picked);

  if (num === answer) {
    score += 1;
    updateHUD();
    playCorrect();
    flash('#ffd24a');
    setTimeout(() => spawnCoins(picked), 220);
    msgEl.textContent = `あたり！ ${num}番の宝箱に金貨が入っていた。`;
  } else {
    hp -= 1;
    updateHUD();
    playWrong();
    flash('#d84343');
    msgEl.textContent = `はずれ… 当たりは ${answer}番だった。`;
    setTimeout(() => {
      const target = chests[answer - 1];
      target.setAttribute('data-open', 'true');
      openLid(target);
      setTimeout(() => spawnCoins(target), 300);
    }, 420);
  }

  setTimeout(() => {
    round += 1;
    if (hp <= 0) {
      gameOver();
    } else if (round > TOTAL_ROUNDS) {
      finish();
    } else {
      startRound();
    }
  }, 1900);
}

function gameOver() {
  locked = true;
  setButtonsEnabled(false);
  playOver();
  roundText.textContent = 'GAME OVER';
  msgEl.textContent = `HPが0になった。スコアは ${score} 点。リセットで最初から。`;
}

function finish() {
  locked = true;
  setButtonsEnabled(false);
  roundText.textContent = 'FINISH';
  if (score === TOTAL_ROUNDS) {
    playCorrect();
    msgEl.textContent = `パーフェクト！ 3問すべて正解（${score}点）。`;
  } else {
    msgEl.textContent = `ゲーム終了。スコアは ${score} / ${TOTAL_ROUNDS} 点。リセットで再挑戦できます。`;
  }
}

function resetGame() {
  round = 1;
  score = 0;
  hp = MAX_HP;
  startRound();
}

/* ============================================================
   イベント登録
   ============================================================ */
buttons.forEach((btn) => {
  btn.addEventListener('click', () => {
    ensureAudio();
    choose(Number(btn.dataset.choice));
  });
});

resetBtn.addEventListener('click', () => {
  ensureAudio();
  resetGame();
});

// 宝箱を直接クリック／タップしても選べるようにする
// （AR.js のカメラ構成では cursor コンポーネントが効きにくいため、自前でレイキャストする）
const AFRAME_THREE = AFRAME.THREE;
const raycaster = new AFRAME_THREE.Raycaster();
const pointerNdc = new AFRAME_THREE.Vector2();

function onPointerDown(ev) {
  if (locked) return;
  const target = ev.target;
  if (target && (target.tagName === 'BUTTON' || target.tagName === 'SELECT')) return;

  pointerNdc.x = (ev.clientX / window.innerWidth) * 2 - 1;
  pointerNdc.y = -(ev.clientY / window.innerHeight) * 2 + 1;

  const camera = scene.camera;
  if (!camera) return;

  const hitboxes = chests.map((c) => c.querySelector('.hitbox').object3D);
  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObjects(hitboxes, true);
  if (!hits.length) return;

  const chestEl = hits[0].object.el.closest('.chest');
  if (!chestEl) return;

  ensureAudio();
  choose(Number(chestEl.dataset.index));
}

/* ============================================================
   起動
   ============================================================ */
const scene = document.querySelector('a-scene');
scene.addEventListener('loaded', () => {
  resetGame();

  // 3Dオブジェクトのクリック判定は canvas 上で受け取る
  if (scene.renderer && scene.renderer.domElement) {
    scene.renderer.domElement.addEventListener('pointerdown', onPointerDown);
  }
});

// マーカーを認識したらヒントを消す
const marker = document.querySelector('a-marker');
marker.addEventListener('markerFound', () => {
  document.getElementById('hint').style.display = 'none';
});
marker.addEventListener('markerLost', () => {
  document.getElementById('hint').style.display = 'block';
});
</script>
</body>
</html>
